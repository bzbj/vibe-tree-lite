<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="vibe-tree-token" content="__VIBE_TREE_CSRF_TOKEN__">
    <title>Vibe Tree Lite · 阳光积木</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Vibe Tree Lite · 阳光积木 首页">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span class="brand-copy">
            <strong><span class="brand-base">Vibe Tree Lite</span><span class="brand-theme">· 阳光积木</span></strong>
            <small>Sunlit Blocks</small>
          </span>
        </a>
        <div class="toolbar">
          <span class="freshness" id="freshness">正在读取本地统计…</span>
          <div class="sync-state" id="sync-state" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span>正在连接服务</span>
          </div>
          <button class="button" id="sync-button" type="button">立即同步</button>
        </div>
      </header>

      <section class="metric-grid" aria-label="使用量摘要">
        <article class="metric-card metric-primary">
          <span id="today-label">今日 Token</span>
          <strong id="today-total">—</strong>
          <small id="today-date">本地时区</small>
        </article>
        <article class="metric-card">
          <span id="period-label">30 日 Token</span>
          <strong id="period-total">—</strong>
          <small id="period-note">包含已同步设备</small>
        </article>
        <article class="metric-card">
          <span id="model-label">常用模型</span>
          <strong class="metric-text" id="top-model">—</strong>
          <small id="model-note">按 30 日消耗量</small>
        </article>
        <article class="metric-card">
          <span id="context-label">同步设备</span>
          <strong id="device-count">—</strong>
          <small id="context-note">等待 watcher</small>
        </article>
      </section>

      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">DAILY / MODEL</p>
            <h2 id="chart-title">每日模型消耗</h2>
          </div>
          <div class="chart-summary">
            <span class="chart-total" id="all-total">累计 —</span>
            <button class="clear-filter" id="clear-model" type="button" hidden>显示全部模型</button>
          </div>
        </div>
        <div class="legend" id="legend" aria-label="模型图例与筛选"></div>
        <div class="chart-wrap">
          <div class="y-axis" aria-hidden="true"><span id="axis-max">—</span><span id="axis-mid">—</span><span>0</span></div>
          <div class="chart" id="chart" role="group" aria-label="最近 30 天每日 Token 消耗，按模型堆叠"></div>
        </div>
        <div class="empty-state" id="empty-state" hidden>这段时间还没有可显示的 Token 记录。</div>
        <p class="sr-only" id="model-filter-status" aria-live="polite"></p>
      </section>

      <section class="connect-panel" id="auth-actions" aria-labelledby="connect-title" hidden>
        <div>
          <p class="eyebrow">GITHUB SYNC</p>
          <h2 id="connect-title">连接 GitHub 同步</h2>
          <p id="auth-note">登录后会自动查找云端小树；有就加入，没有就从本机开始。</p>
        </div>
        <div class="connect-actions">
          <button class="button button-wide" id="github-connect-button" data-action="connect-github" type="button">使用 GitHub 登录</button>
        </div>
      </section>

      <footer>
        <span id="service-version">Vibe Tree Lite</span>
        <span>仅监听 127.0.0.1</span>
      </footer>
    </main>
    <div class="chart-tooltip" id="chart-tooltip" role="tooltip" hidden>
      <div class="tooltip-heading"><span class="tooltip-swatch"></span><strong id="tooltip-model"></strong></div>
      <span class="tooltip-date" id="tooltip-date"></span>
      <strong class="tooltip-value" id="tooltip-value"></strong>
      <span class="tooltip-share" id="tooltip-share"></span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
